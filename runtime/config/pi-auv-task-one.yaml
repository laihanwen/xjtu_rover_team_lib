# A2 task-one commissioning template: DISARM, no motion, no network dependence.
camera:
  # Down camera is CSI; measured underwater intrinsics below.
  source: csi:0
  width: 320
  height: 240
  fps: 30
  pixel_format: MJPG
  # Underwater calibration 2026-10-08, original 320x240 pixels.
  preview_rectify: true
  calibration_width: 320
  calibration_height: 240
  calibration_id: underwater-down-20261008
  calibration_quality: same_session_validated
  camera_matrix: [413.2923092526209, 0.0, 159.53937104149475, 0.0, 418.54172784620357, 95.11590719479291, 0.0, 0.0, 1.0]
  distortion_coefficients: [0.674561075946785, -0.7099226358925659, -0.07017894158087441, 0.0008090055501311443, -0.07124098219367185]
camera_front:
  enabled: true
  source: /dev/v4l/by-id/usb-HD_Camera_Manufacturer_USB_2.0_Camera-video-index0
  width: 320
  height: 240
  fps: 30
  # Current rectification accepted by user on 2026-10-10; retain existing K/D.
  preview_rectify: true
  calibration_width: 320
  calibration_height: 240
  calibration_id: underwater-front-trial-20261008
  calibration_quality: user_verified_20261010
  camera_matrix: [330.922779006695, 0.0, 148.05861974792015, 0.0, 351.869456969992, 141.7192514430644, 0.0, 0.0, 1.0]
  distortion_coefficients: [-0.2574423751465809, -1.258184396225997, -0.07397539006050448, 0.0024943819270529946, 5.38508326862477]
serial:
  device: ""
  baud: 115200
control:
  socket: /run/auv-runtime/control.sock
operation:
  # debug requires explicit auvctl commands. autonomous starts without an operator.
  mode: debug
  auto_origin: true
  auto_start: false
  auto_arm: false
  startup_delay_sec: 5.0
  startup_timeout_sec: 30.0
  startup_stable_sec: 1.0
vision:
  expected_cones: 4
  single_yellow_edge: true
  white_grid_edges: true
  white_s_max: 60
  local_pipe_centres: false # Experimental ridge detector, validate recall before enabling.
  white_v_min: 150
  yellow_oriented_frames: 3
  grid_dark_value_max: 95
  yellow_edge_minimum_support: 0.45
  yellow_edge_margin: 0.20
  apriltag_ids: [18] # 用户确认比赛沿用现场验证规格
  apriltag_camera: front # 前视先发现标签；ROV 与其他旧配置默认 down
  apriltag_stable_frames: 3
  apriltag_family: tag16h5
  grid_stable_frames: 3
  cone_minimum_confidence: 0.72
  cone_vision_mode: colour # colour / shape / agreement; alternative requires validated body weights
  cone_shape_model: ""
  cone_shape_model_id: ""
  cone_shape_model_verified: false
  cone_history_size: 5
  cone_required_votes: 3
  cone_clear_votes: 3
planning:
  maximum_targets: 8
  target_object_types: [circle_cone, square_cone]
  blocked_object_types: [obstacle, forbidden]
mission:
  profile: a2_task_one
  self_check_timeout_sec: 10.0
  apriltag_timeout_sec: 30.0
  map_timeout_sec: 30.0
  planning_timeout_sec: 10.0
  cone_visit_timeout_sec: 120.0
  cucumber_search_timeout_sec: 60.0
  cucumber_align_timeout_sec: 30.0
  gripper_timeout_sec: 15.0
  transport_timeout_sec: 120.0
  valve_search_timeout_sec: 60.0
  valve_align_timeout_sec: 30.0
  valve_rotate_timeout_sec: 30.0
  return_home_timeout_sec: 120.0
  surface_timeout_sec: 60.0
safety:
  status_timeout_sec: 0.5
  frame_timeout_sec: 0.5
  pose_timeout_sec: 0.5
  control_watchdog_timeout_sec: 0.25
  actuator_status_timeout_sec: 0.5
motion:
  motion_commands_enabled: false
  directions_calibrated: false
  limits_calibrated: false
  surge_from_row: 0.0
  surge_from_col: 0.0
  sway_from_row: 0.0
  sway_from_col: 0.0
  maximum_speed: 0.1
  arrival_tolerance: 0.15
  arrival_stable_ticks: 5
logging:
  events: /var/log/auv-runtime/events.ndjson
  debug_dir: /var/log/auv-runtime/debug
  max_event_bytes: 10485760
video:
  enabled: false
  directory: /run/auv-runtime/hls
  encoder: h264_v4l2m2m
  software_fallback_enabled: false
  width: 640
  height: 240
  fps: 30
  bitrate_kbps: 2000
  segment_time_sec: 0.5
web:
  enabled: false
  bind: 192.168.137.201
  port: 8080
  assets: /usr/local/share/auv-runtime/web

# Independent read-only plane odometry. Do not mark verified until underwater calibration.
grid_exit:
  enabled: false
  verified: false
  allowed_sides_mask: 0 # N/E/S/W bits; no permitted side guessed.
  body_radius_m: 0 # Measured whole-body horizontal bounding radius required.
  clearance_m: 0 # Measured external corridor clearance required.
  speed_mps: 0.1
  timeout_sec: 60

localization:
  enabled: true
  hz: 10
  telemetry_file: /run/auv-rov/localization-input.json
  width: 320
  height: 240
  camera_matrix: [413.2923092526209, 0.0, 159.53937104149475, 0.0, 418.54172784620357, 95.11590719479291, 0.0, 0.0, 1.0]
  distortion: [0.674561075946785, -0.7099226358925659, -0.07017894158087441, 0.0008090055501311443, -0.07124098219367185]
  camera_to_body: [1, 0, 0, 0, -1, 0, 0, 0, -1] # 下视图像右侧为机体前方
  camera_offset_m: [0.09, 0.01, -0.06]  # user measured, metres; camera orientation is a separate field
  depth_offset_m: [-0.16, 0.02, -0.05]  # user-confirmed body-frame metres
  imu_signs: []  # roll/pitch 已实测 +1；yaw 数值映射待取证，不能填完整三元组
  imu_offsets_deg: [0, 0, 0] # MCU 已扣水平参考和首帧 yaw 原点，不重复扣除
  pool_depth_m: 1.4 # 用户确认实际水深，m；作业上限仍独立配置
  depth_zero_m: 0 # AUV 固件先扣 AUV_DEPTH_ZERO_M；定位不重复扣零，非实测零点值
  calibration_verified: false

# Onboard recording starts at process launch; no PC streaming client is needed.
recording:
  enabled: true
  required_for_motion: true
  directory: /var/log/auv-runtime/runs
  segment_sec: 60
  minimum_free_bytes: 268435456

# Fill safe relative-origin corridors from real pool measurements. No default patrol.
# A perimeter lap uses measured corner waypoints followed by its start point.
# Check accumulated coverage afterwards; a lap alone need not observe the centre.
observation_search:
  enabled: false
  corridor_calibrated: false
  maximum_radius_m: 0
  waypoints_m: []
  maximum_speed: 0.1
  position_gain: 0.4
  arrival_tolerance_m: 0.1
  arrival_stable_sec: 0.5
  pose_timeout_sec: 0.3
  waypoint_timeout_sec: 20
  depth_target_m: 0
  yaw_relative_rad: 0

release:
  git_commit: UNVERIFIED
  firmware_hex_sha256: UNVERIFIED
  calibration_id: UNVERIFIED
  model_sha256: not_used_a1

# A2 remains disabled until ascent column and surface imaging have been measured.
# Firmware must publish the 17-byte depth frame with true sensor sequence/age.
surface_traversal:
  enabled: false
  ascent_clearance_verified: false
  center_approach_verified: false
  center_approach_radius_cells: 0 # measured clear region inside central cell
  center_stable_sec: 0.3
  center_timeout_sec: 10
  surface_localization_verified: false
  ascent_cell: [-1, -1] # measured row,col; yellow edge is map bottom
  ascent_tolerance_cells: 0.15
  cell_size_m: 0.82 # 图纸接头中心格距，用户确认现场一致
  depth_target_m: 0 # TODO: confirmed surface/shallow-water rule and measured datum
  depth_tolerance_m: 0.05
  ascent_rate_mps: 0.03
  surface_stable_sec: 1.0
  surface_depth_samples: 3
  depth_sample_timeout_sec: 2.5
  reacquire_frames: 5
  reacquire_timeout_sec: 15
  pose_timeout_sec: 0.3
  maximum_speed: 0.1
  position_gain: 0.4
  arrival_tolerance_cells: 0.12
  arrival_stable_sec: 0.3
  entry_margin_cells: 0.05
  boundary_clearance_m: 0 # measured body radius + safety clearance
  corridor_tolerance_cells: 0.2
  pose_jump_tolerance_m: 0.05
  waypoint_timeout_sec: 20
  height_tolerance_m: 0.15
  maximum_reprojection_px: 3
  minimum_grid_confidence: 0.8
  width: 640
  height: 480
  camera_matrix: [] # independently verified surface intrinsics
  distortion_coefficients: []

# 前视度量建图/定位：让前视相机承担九宫格建图与绝对定位（取代下视在
# BUILD_MAP / 近水面重定位 / 遍历中的绝对位姿角色）。Runtime 已使用独立采集缓存，
# 按任务阶段选择水下/近水面模型；verified 保持 false 期间
# metric_grid_pose 只返回 "metric calibration unverified"，不产生位姿。
# 仅当 surface_traversal.enabled 同时为 true 时生效并参与校验。
# 2026-10-10 用户确认前视俯角 45°，矩阵采用正装零滚转/偏航约定。
front_metric:
  enabled: false
  underwater:
    verified: true # 用户确认现有矫正方案；完整导航仍受场地/深度/安全配置门控
    width: 320
    height: 240
    camera_matrix: [330.922779006695, 0.0, 148.05861974792015, 0.0, 351.869456969992, 141.7192514430644, 0.0, 0.0, 1.0]
    distortion_coefficients: [-0.2574423751465809, -1.258184396225997, -0.07397539006050448, 0.0024943819270529946, 5.38508326862477]
  surface:
    verified: false
    width: 320
    height: 240
    camera_matrix: []
    distortion_coefficients: []
  camera_to_body: [0, -0.7071067811865476, 0.7071067811865476, -1, 0, 0, 0, -0.7071067811865476, -0.7071067811865476] # 前视 45°，安装约定见 hardware/camera-mounting-20261010.yaml
  camera_offset_m: [0.15, 0.03, 0.02]  # 用户实测，m
  depth_offset_m: [-0.16, 0.02, -0.05]   # 用户确认；与 localization 一致，单位 m

# Experimental local topology / map accumulation / bounded down odometry.
# Keep disabled until the new C++ replay and full Runtime regression pass.
local_mapping:
  enabled: false
  navigation_verified: false
  odometry_budget_sec: 1.0
  coverage:
    required_views: 3  # Independent accepted frames per 1/16-cell interior tile.
  empty_floor:
    verified: false
    # hsv_lower / hsv_upper must come from labeled visible-floor samples.
    minimum_support: 0.95
