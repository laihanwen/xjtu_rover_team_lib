<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUV 自动任务中心</title>
<style>*{box-sizing:border-box}body{margin:0;padding:36px clamp(18px,4vw,64px);max-width:1440px;margin-inline:auto;background:#0b1421;color:#e6eef8;font:16px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}h1{font-size:clamp(26px,4vw,42px);letter-spacing:-1px;margin:6px 0 12px}h2{font-size:18px;margin:0 0 14px}p{color:#a8bacd}a{color:#61d9c4;text-underline-offset:4px}section,.card{background:#121f30;border:1px solid #26364a;padding:24px;border-radius:18px;margin:20px 0;box-shadow:0 8px 28px #0002}button{padding:13px 22px;font-family:inherit;font-size:15px;font-weight:600;border:1px solid #35516b;border-radius:10px;background:#20354a;color:#e6eef8;cursor:pointer;min-height:48px}button:hover{filter:brightness(1.15)}button:focus-visible,a:focus-visible{outline:3px solid #61d9c4;outline-offset:4px}button:disabled{opacity:.4;cursor:not-allowed}#arm{background:#217869;border-color:#40bba3}#stop{background:#b73749;border-color:#d96673;margin-left:8px}.warn,.bad{color:#ffc594}.axis{display:grid;grid-template-columns:180px 1fr 75px;gap:14px;align-items:center;margin:18px 0}meter{width:100%;height:24px;accent-color:#61d9c4}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 Consolas,monospace;color:#a8bacd}.eyebrow{font-size:12px;letter-spacing:3px;color:#61d9c4;font-weight:700}.subtitle{margin-bottom:26px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#152438;border:1px solid #2a3e54;border-radius:14px;padding:18px}.stat span{display:block;color:#91a8bd;font-size:12px}.stat strong{display:block;font-size:26px;line-height:1.4;color:#f0f7ff;margin-top:8px}.layout{display:grid;grid-template-columns:1.7fr 1fr;gap:22px;align-items:start}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{min-height:86px;padding:12px;background:#182b40;border:1px solid #35516b;border-radius:10px;font-size:13px}.cell.current{border:2px solid #61d9c4}.cell.next{background:#254764}.small{font-size:13px;color:#a8bacd}video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#050b12;border-radius:12px}details summary{cursor:pointer;color:#c7d8e9;padding:8px 0}#mode{margin-top:20px}#detail{min-height:24px}@media(max-width:760px){body{padding:20px 16px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.axis{grid-template-columns:1fr 60px}.axis span:first-child{grid-column:1/-1}section,.card{padding:18px}#stop{margin:8px 0}}</style>
<div class="eyebrow">AUTONOMOUS MISSION / AUV</div><h1>自动任务中心</h1><p class="subtitle">双摄视觉 · 九宫格地图 · 任务进度<br>只读监看；任务控制通过 SSH 使用 auvctl。</p><div class="stats"><div class="stat"><span>任务阶段</span><strong id="phase-value">—</strong></div><div class="stat"><span>推进器状态</span><strong id="arm-value">—</strong></div><div class="stat"><span>视觉处理</span><strong id="vision-value">—</strong></div><div class="stat"><span>规划航点</span><strong id="waypoints-value">—</strong></div></div><div class="layout"><div>
<div class="card"><p><button onclick="preview(true)">实时双摄 MJPEG</button> <button id="hls-option" onclick="preview(false)">HLS 兼容预览</button></p><div id="live-pair" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>CSI 下视<img id="down-live" style="width:100%;background:#050b12"></div><div id="front-panel">USB 前视<img id="front-live" style="width:100%;background:#050b12"></div></div><video style="display:none" id="video" controls autoplay muted playsinline></video><p id="video-state">视频连接中</p><p id="cameras">左：CSI下视任务视觉；右：USB前视（启用双摄时）</p></div>
</div><div><div class="card"><h2>场地地图 · 九宫格</h2><div id="grid" class="grid"></div><p id="route"></p></div>
<div class="card"><details><summary>完整任务状态</summary><pre id="state">状态连接中</pre></details></div></div></div>
<script src="/hls.min.js"></script><script>
const v=document.getElementById('video'),vs=document.getElementById('video-state');
let mjpeg=true,hls=null,frontAvailable=false,previewReady=false;
function imageStart(id,role){const image=document.getElementById(id);image.onerror=()=>{if(mjpeg&&(role==='down'||frontAvailable))setTimeout(()=>{if(mjpeg&&(role==='down'||frontAvailable))image.src='/api/camera/'+role+'.mjpeg?t='+Date.now()},1000)};image.src='/api/camera/'+role+'.mjpeg';}
function preview(live){if(previewReady&&mjpeg===live)return;previewReady=true;mjpeg=live;document.getElementById('live-pair').style.display=live?'grid':'none';v.style.display=live?'none':'block';if(live){if(hls){hls.destroy();hls=null}v.removeAttribute('src');v.load();imageStart('down-live','down');if(frontAvailable)imageStart('front-live','front');vs.textContent='MJPEG 实时预览 · 独立于视觉处理帧率'}else{for(const id of ['down-live','front-live'])document.getElementById(id).removeAttribute('src');if(Hls.isSupported()){hls=new Hls({liveSyncDurationCount:2});hls.loadSource('/hls/index.m3u8');hls.attachMedia(v);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)vs.textContent='HLS 不可用：'+d.details})}else if(v.canPlayType('application/vnd.apple.mpegurl'))v.src='/hls/index.m3u8';else vs.textContent='此浏览器不支持 HLS';}}
preview(true);
async function refresh(){try{const s=await (await fetch('/api/status',{cache:'no-store'})).json();document.getElementById('state').textContent=JSON.stringify(s,null,2);document.getElementById('hls-option').disabled=s.video_enabled===false;document.getElementById('hls-option').textContent=s.video_enabled===false?'HLS 未启用':'HLS 兼容预览';document.getElementById('phase-value').textContent=s.phase||'未知';document.getElementById('arm-value').textContent=s.armed?'已 ARM':'未 ARM';document.getElementById('vision-value').textContent=Number.isFinite(s.vision_hz)?s.vision_hz.toFixed(1)+' Hz':'—';document.getElementById('waypoints-value').textContent=s.route_waypoints??'—';if(frontAvailable!==!!s.front_enabled){frontAvailable=!!s.front_enabled;if(frontAvailable&&mjpeg)imageStart('front-live','front');else document.getElementById('front-live').removeAttribute('src');}document.getElementById('front-panel').style.display=frontAvailable?'block':'none';document.getElementById('cameras').textContent=s.front_enabled?'双路：CSI下视 '+(s.down_hz||0).toFixed(1)+' Hz；USB前视 '+s.front_hz.toFixed(1)+' Hz'+(s.front_degraded?' · 前视断流或未就绪':''):'下视单路；前视未启用';const g=document.getElementById('grid');g.replaceChildren();for(const c of (s.cells||[])){const e=document.createElement('div');e.className='cell'+(s.pose_valid&&Math.floor(s.row)===c.row&&Math.floor(s.col)===c.col?' current':'')+(s.next_row===c.row&&s.next_col===c.col?' next':'');e.textContent=c.row+','+c.col+' · '+c.object+(c.visited?' ✓':'');g.append(e)}document.getElementById('route').textContent='当前格：'+(s.pose_valid?Math.floor(s.row)+','+Math.floor(s.col):'未知')+'　下一航点：'+(s.next_row>=0?s.next_row+','+s.next_col:'无');if(!mjpeg&&s.video_degraded)vs.textContent='视频降级：'+s.video_detail}catch(e){document.getElementById('state').textContent='状态连接失败：'+e;for(const id of ['phase-value','arm-value','vision-value','waypoints-value'])document.getElementById(id).textContent='—';document.getElementById('route').textContent='连接中断 · 地图为最后接收状态'}}
setInterval(refresh,500);refresh();
</script></html>
