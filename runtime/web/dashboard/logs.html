<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>深蓝 · 日志分析</title><style>body{background:#101b29;color:#eff5fa;font:15px/1.7 'Segoe UI','Microsoft YaHei',sans-serif;margin:0}main{max-width:1200px;margin:auto;padding:28px}header{border-bottom:3px solid #68b9ec}button,input,select{background:#23394b;color:white;border:1px solid #60788e;padding:10px;margin:5px;border-radius:5px}section{background:#172637;padding:20px;margin:18px 0;border:1px solid #34475c;border-radius:10px}canvas{width:100%;height:240px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #34475c;padding:9px;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere}details{max-width:650px}.warn{color:#f1c675}a{color:#9ad5f7}</style><main><header><h1>日志分析台</h1><p>ROV / AUV 离线证据 · 原始数据保留 · 未知值保持未知</p></header><section><label>导入 JSONL / JSON 日志 <input id="files" type="file" multiple accept=".jsonl,.json,.log"></label><button id="live">读取当前 ROV 近期日志</button><button id="export">导出 AI 分析包</button><p id="status">文件仅在浏览器本地分析，不上传。单次最多 20 MB、100000 条。</p></section><section><h2>运行摘要</h2><pre id="summary">等待日志</pre></section><section><h2>深度观测 / m</h2><canvas id="chart" width="1100" height="240"></canvas><p>曲线按同一来源与时钟排序；无效读数断开。跨设备或会话不相减。各组独立缩放，范围见图例；纵向位置不用于跨组比较。</p></section><section><h2>时间线与原始证据</h2><input id="search" placeholder="搜索阶段、故障、原因"><label><input id="faults" type="checkbox">只看故障或状态变化</label><p>最多显示最近 300 条匹配记录；导出保留全部导入数据。</p><table><thead><tr><th>来源 / 时间</th><th>事件 / 阶段</th><th>原始数据</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="logs.js"></script></html>
