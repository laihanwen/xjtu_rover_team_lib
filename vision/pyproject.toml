[project]
name = "auv-vision-training"
version = "0.1.0"
description = "Isolated YOLO11 training, evaluation, and export tools for the AUV project"
requires-python = ">=3.11,<3.14"
dependencies = [
  "onnx>=1.17,<2",
  "onnxruntime-gpu>=1.20,<2",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "ultralytics>=8.3,<9",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = {index = "pytorch-cu128"}
torchvision = {index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
