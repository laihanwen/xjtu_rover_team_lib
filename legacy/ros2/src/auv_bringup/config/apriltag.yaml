auv_apriltag_detector:
  ros__parameters:
    image_topic: /camera/down/image_raw
    # Use compressed after installing ros-lyrical-image-transport-plugins when
    # raw 640x480 transport is too slow on the selected DDS/network path.
    image_transport: raw
    detections_topic: /apriltag/detections
    debug_topic: /apriltag/debug_image
    family: tag36h11
    tag_size: 0.16
    decimate: 1.0
    refine_edges: true
    publish_debug_image: false

    # Intrinsics are shared through down_camera_calibration.yaml. Until they
    # are filled, detections remain valid in pixels and pose_valid is false.
