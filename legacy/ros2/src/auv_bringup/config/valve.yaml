auv_valve_detector:
  ros__parameters:
    image_topic: /camera/front/image_raw
    image_transport: raw
    detection_topic: /valve/detection
    debug_topic: /valve/debug_image
    publish_debug_image: true
    # Keep camera streaming independent; cap OpenCV work for Raspberry Pi 4B.
    processing_rate: 15.0

    # Conservative placeholders. Tune only from representative underwater recordings.
    minimum_area_ratio: 0.002
    maximum_area_ratio: 0.65
    minimum_circularity: 0.72
    minimum_aspect_score: 0.72
    minimum_confidence: 0.72
    blur_kernel: 5
    canny_low: 50.0
    canny_high: 150.0
    morphology_kernel: 3
    handle_minimum_length_ratio: 0.30
    handle_maximum_center_offset_ratio: 0.35
