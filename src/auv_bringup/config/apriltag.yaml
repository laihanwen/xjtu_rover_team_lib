auv_apriltag_detector:
  ros__parameters:
    image_topic: /camera/down/image_raw
    detections_topic: /apriltag/detections
    debug_topic: /apriltag/debug_image
    family: tag36h11
    tag_size: 0.16
    decimate: 1.0
    refine_edges: true
    publish_debug_image: false

    # Fill these after calibrating the down camera. Until then detections remain
    # valid in pixel coordinates and pose_valid remains false.
    # camera_matrix: [fx, 0.0, cx, 0.0, fy, cy, 0.0, 0.0, 1.0]
    # distortion_coefficients: [k1, k2, p1, p2, k3]
