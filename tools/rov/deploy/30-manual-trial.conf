[Unit]
Description=ROV manual CRC trial (explicit ARM, physical joystick deadman)

[Service]
RuntimeDirectory=auv-rov
RuntimeDirectoryMode=0755
ExecStart=
ExecStart=/usr/bin/python3 -u /usr/local/lib/auv-rov/trial_server.py --bind ${ROV_BIND} --port ${ROV_PORT} --device /dev/serial0
PrivateDevices=false
SupplementaryGroups=dialout
DevicePolicy=closed
DeviceAllow=/dev/ttyS0 rw
